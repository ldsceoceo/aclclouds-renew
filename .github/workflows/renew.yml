name: ACLClouds Auto Renew

on:
  workflow_dispatch:
  schedule:
    # Free 档每 4 天续订一次，续期窗口 = 到期前 2 天开放（连续 2 天）。
    # 每 2 天跑一次（奇数日 1/3/5...31），任意连续 2 天窗口必命中一次；
    # 月末 31→1 间隔 1 天，只会多跑不会漏。
    # 注意：GitHub cron 高峰期可能延迟，若连续漏跑导致过期，可临时改回每日 '10 10 * * *'。
    - cron: '10 10 */3 * *'

permissions:
  actions: write
  contents: write

jobs:
  renew:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: ⚙️ 部署 sing-box 代理
        # 注：if 里不能用 secrets 上下文；无 NODE_LINK 时脚本自行直连退出
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)
          # setup_proxy.sh 成功时写 GITHUB_ENV: IS_PROXY=true / PROXY_SERVER=socks5://127.0.0.1:1080

      - name: 🔐 验证登录凭证
        run: |
          if [ -z "${{ secrets.ACL_EMAIL }}" ] && [ -z "${{ secrets.COOKIE_VALUE }}" ]; then
            echo "❌ 未配置 COOKIE_VALUE，或 ACL_EMAIL + ACL_PASSWORD"
            exit 1
          fi

      - name: 🚀 运行续期脚本
        env:
          ACL_EMAIL: ${{ secrets.ACL_EMAIL }}
          ACL_PASSWORD: ${{ secrets.ACL_PASSWORD }}
          COOKIE_VALUE: ${{ secrets.COOKIE_VALUE }}
          SERVER_PAGE_URL: ${{ secrets.SERVER_PAGE_URL }}
          SERVER_ID: ${{ secrets.SERVER_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          DRY_RUN: ${{ vars.DRY_RUN || 'false' }}
          HEADLESS: true
          TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Shanghai' }}
          LOCALE: en-US
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: npm start

      - name: ☁️ 上传截图与日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Aclclouds-Artifacts-${{ github.run_number }}
          path: screenshots/*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: 🕒 更新时间戳
        # 每次运行更新 time.txt，防止 6 个月无更新导致 GitHub 暂停 Actions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')" > time.txt
          git add time.txt
          if git diff --cached --quiet; then
            echo "No need to commit"
          else
            git commit -m "⏱️ Auto Update $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')"
            git push origin HEAD
          fi

      - name: 🧹 清理旧工作流记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          retain_min_runs: 1
